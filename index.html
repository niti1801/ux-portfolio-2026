<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Niti Punjabi — UX Researcher: discovery, usability, synthesis, and research that moves products forward."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono&display=swap"
      rel="stylesheet"
    />
    <title>UX Portfolio 2026</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme-preference')
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var t = p === 'light' || p === 'dark' ? p : sysDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
