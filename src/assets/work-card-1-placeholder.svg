<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Project preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf3dc"/>
      <stop offset="45%" stop-color="#fbeee8"/>
      <stop offset="100%" stop-color="#f5ddd2"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8957a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e8957a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d07258"/>
      <stop offset="100%" stop-color="#e8957a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d07258" stroke-width=".6" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="600" height="680" fill="url(#bg)"/>
